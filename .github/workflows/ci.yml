name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Run root tests
        run: npm test
      - name: Run root lint
        run: npm run lint
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ratinggame/package-lock.json
      - name: Install ratinggame dependencies
        working-directory: ratinggame
        run: npm ci
      - name: Run ratinggame lint
        working-directory: ratinggame
        run: npm run lint
      - name: Build ratinggame
        working-directory: ratinggame
        run: npm run build
