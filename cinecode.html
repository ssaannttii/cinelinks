<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#252c35;--s1:#2c343f;--bdr:rgba(255,255,255,.07);--txt:#f0f0f0;--mut:#9aa4b0;--gold:#e8a000;--good:#5bbd7a;--green:#388e3c;--red:#9e3b3b}
body{font-family:'Schibsted Grotesk','Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex}
.wrap{max-width:520px;margin:auto;padding:26px 16px 70px;width:100%;text-align:center}
.logo{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.logo b{color:var(--gold)}
.tag{color:var(--mut);font-size:.9rem;margin:6px 0 4px}
.kicker{color:var(--gold);font-weight:700;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
.ghead,.gstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:470px;margin-left:auto;margin-right:auto}
.ghead{margin-bottom:7px}
.ghl{font-size:.54rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);text-align:center;font-weight:700}
.grow{max-width:470px;margin:0 auto 9px;animation:pop .32s both}
.gtitle{display:flex;align-items:center;gap:8px;margin:0 0 4px;text-align:left}
.gtitle img{width:26px;height:39px;border-radius:4px;object-fit:cover;background:#333;flex-shrink:0}
.gtitle .t{font-weight:600;font-size:.85rem;line-height:1.15}
.gtitle .y{color:var(--mut);font-size:.72rem;font-weight:600}
.cx{border-radius:8px;min-height:46px;display:flex;align-items:center;justify-content:center;padding:3px 2px;font-size:.72rem;font-weight:800;text-align:center;line-height:1.08;background:var(--s1);border:1px solid var(--bdr);color:var(--mut)}
.cx.green{background:var(--green);color:#fff;border-color:transparent}
.cx.gold{background:var(--gold);color:#1a1200;border-color:transparent}
.cx.red{background:var(--red);color:#fff;border-color:transparent}
.cx .ar{font-weight:900;margin-left:2px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.anchors{max-width:470px;margin:6px auto 0;text-align:left;font-size:.76rem;color:var(--txt);line-height:1.45;display:flex;flex-wrap:wrap;gap:1px 4px;align-items:baseline}
.anchors .ak{opacity:.6;font-size:.82rem}
.anchors .asep{color:var(--mut);margin:0 5px}
.revnote{color:var(--mut);font-size:.68rem;margin:6px auto 0;max-width:440px}
.ladder{max-width:470px;margin:0 auto 14px;padding:11px 12px;border:1px solid rgba(232,160,0,.28);background:rgba(232,160,0,.05);border-radius:12px;text-align:left}
.ltitle{font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.lmore{color:var(--mut);font-weight:600;letter-spacing:0;text-transform:none}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--bdr);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;color:var(--txt);animation:pop .3s both}
.lchip .lk{opacity:.7;font-size:.9rem}
.lchip.locked{color:var(--mut);opacity:.55;padding:5px 10px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 14px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16)}
.dot.used{background:#c0494a}
.dot.win{background:var(--good)}
.hint{color:var(--mut);font-size:.82rem;margin:0 0 10px}
.guess{position:relative;max-width:440px;margin:0 auto}
.guess input{width:100%;padding:13px 15px;border-radius:11px;border:1px solid var(--bdr);background:rgba(255,255,255,.05);color:var(--txt);font-family:inherit;font-size:.95rem;outline:none}
.guess input:focus{border-color:rgba(232,160,0,.55)}
.guess input:disabled{opacity:.55}
.ac{position:absolute;left:0;right:0;top:54px;background:#212831;border:1px solid var(--bdr);border-radius:11px;overflow:hidden;z-index:5;text-align:left;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.ac-item{display:flex;align-items:center;gap:10px;padding:8px 11px;cursor:pointer}
.ac-item:hover,.ac-item.sel{background:rgba(232,160,0,.12)}
.ac-item img{width:28px;height:40px;object-fit:cover;border-radius:5px;background:#333;flex-shrink:0}
.ac-item .nm{font-weight:600;font-size:.86rem}
.ac-item .kf{color:var(--mut);font-size:.72rem}
.miss{min-height:20px;color:#d98b8b;font-size:.8rem;margin-top:9px}
.row{display:flex;gap:8px;max-width:440px;margin:12px auto 0}
.btn{flex:1;padding:11px;border-radius:11px;border:1px solid var(--bdr);background:transparent;color:var(--txt);font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.btn.gold{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.btn:hover{opacity:.92}
.result{margin-top:16px;padding:18px;border-radius:14px;border:1px solid var(--bdr);background:rgba(255,255,255,.04);display:none}
.result.show{display:block;animation:pop .4s both}
.result h2{font-size:1.3rem;margin-bottom:4px}
.result h2.win{color:var(--good)}
.result .who{display:flex;align-items:center;gap:12px;justify-content:center;margin:12px 0}
.result .who img{width:56px;height:84px;border-radius:8px;object-fit:cover;border:1px solid var(--bdr)}
.result .who .nm{font-weight:800;font-size:1.05rem;text-align:left}
.result .who .sub{color:var(--mut);font-size:.8rem}
.result .who .cred{color:var(--mut);font-size:.74rem;margin-top:3px}
.result .who .nm .y{color:var(--mut);font-weight:600;font-size:.82rem}
.stats{display:flex;gap:16px;justify-content:center;margin:14px 0 2px}
.stat{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.6rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:1.2rem;color:var(--txt);font-weight:800}
.legend{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;margin:2px auto 16px;font-size:.66rem;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.loading{color:var(--mut);font-size:.9rem;padding:40px 0}
.foot{margin-top:24px;color:var(--mut);font-size:.74rem}
.foot a{color:var(--gold);text-decoration:none}
.cl-home{position:fixed;top:13px;left:13px;z-index:50;display:inline-flex;align-items:center;gap:5px;color:var(--mut);text-decoration:none;font-size:.78rem;font-weight:700;background:rgba(20,20,20,.6);border:1px solid var(--bdr);border-radius:999px;padding:7px 13px;backdrop-filter:blur(8px)}
.cl-home:hover{color:var(--gold);border-color:rgba(232,160,0,.45)}
@media(min-width:760px){.wrap{max-width:560px}.logo{font-size:2.4rem}.cx{font-size:.78rem;min-height:50px}.ghl{font-size:.6rem}}
</style>

<body>
<a href="/" class="cl-home" aria-label="Back to CineLinks">← CineLinks</a>
<div class="wrap" id="cinecode-app">
  <div class="logo">Cine<b>Code</b></div>
  <div class="tag">Decode the hidden movie</div>
  <div class="kicker" id="modeLbl">Daily</div>
  <div id="stage"><div class="loading" style="padding:6px 0" aria-label="Loading">
    <div class="fx-skel-wrap" style="gap:10px;align-items:center">
      <div class="fx-skel-row" style="justify-content:center;gap:5px"><span class="fx-skel" style="width:60px;height:9px"></span><span class="fx-skel" style="width:60px;height:9px"></span><span class="fx-skel" style="width:60px;height:9px"></span></div>
      <span class="fx-skel" style="width:100%;height:46px;border-radius:9px"></span>
      <span class="fx-skel" style="width:100%;height:46px;border-radius:12px"></span>
    </div>
  </div></div>
  <div class="foot">Data from TMDB · part of <a href="/">CineLinks</a></div>
</div>

<script src="/fx.js"></script>
<script defer src="/sfx.js"></script>
<script src="/cineclue-pool.js"></script>
<script>/* collection.js is only needed on a win (Collection.add/reveal, always guarded) — load it at idle instead of on the critical path so the game boots faster */window.addEventListener("load",function(){var L=function(){if(window.Collection)return;var s=document.createElement("script");s.src="/collection.js";document.head.appendChild(s);};window.requestIdleCallback?requestIdleCallback(L,{timeout:3000}):setTimeout(L,1200);});</script>
<script>
(function(){
  const IMG='https://image.tmdb.org/t/p/';
  const MAX=6;                 // guesses allowed

  const stage=document.getElementById('stage');

  // --- i18n (self-contained; i18n.js isn't loaded on game pages) ---
  function _lang(){ try{ var l=localStorage.getItem('clLang'); return (l&&/^[a-z]{2}-[A-Z]{2}$/.test(l))?l.slice(0,2):'en'; }catch(_){ return 'en'; } }
  var L = {
    daily:       { en:'Daily', es:'Diario', fr:'Quotidien', de:'Täglich', pt:'Diário' },
    practice:    { en:'Practice', es:'Práctica', fr:'Entraînement', de:'Übung', pt:'Treino' },
    streak:      { en:'streak', es:'racha', fr:'série', de:'Serie', pt:'sequência' },
    best:        { en:'best', es:'mejor', fr:'record', de:'Bestwert', pt:'recorde' },
    played:      { en:'played', es:'jugadas', fr:'jouées', de:'gespielt', pt:'jogadas' },
    won:         { en:'won', es:'ganadas', fr:'gagnées', de:'gewonnen', pt:'vitórias' },
    tagline:     { en:'Decode the hidden movie', es:'Descifra la película secreta', fr:'Décodez le film caché', de:'Entschlüssle den Film', pt:'Decifra o filme secreto' },
    prompt:      { en:'Name a film to decode the secret', es:'Nombra una peli para descifrar la secreta', fr:'Nommez un film pour décoder le secret', de:'Nenne einen Film', pt:'Nomeia um filme' },
    placeholder: { en:'Guess a movie…', es:'Adivina una película…', fr:'Devinez un film…', de:'Rate einen Film…', pt:'Adivinha um filme…' },
    left:        { en:'left', es:'restantes', fr:'restants', de:'übrig', pt:'restantes' },
    nope:        { en:'couldn’t load that one — try another', es:'no se pudo cargar — prueba otra', fr:'chargement impossible — essayez un autre', de:'nicht ladbar — versuch einen anderen', pt:'não carregou — tenta outro' },
    already:     { en:'already guessed', es:'ya la probaste', fr:'déjà deviné', de:'schon geraten', pt:'já tentaste' },
    gotIt:       { en:'Decoded!', es:'¡Descifrada!', fr:'Décodé !', de:'Entschlüsselt!', pt:'Decifrado!' },
    soClose:     { en:'Out of guesses', es:'Sin intentos', fr:'Plus d’essais', de:'Keine Versuche mehr', pt:'Sem tentativas' },
    solvedIn:    { en:'decoded in', es:'descifrada en', fr:'décodé en', de:'gelöst in', pt:'decifrado em' },
    tries:       { en:'tries', es:'intentos', fr:'essais', de:'Versuche', pt:'tentativas' },
    theAnswer:   { en:'the answer', es:'la respuesta', fr:'la réponse', de:'die Lösung', pt:'a resposta' },
    share:       { en:'Share', es:'Compartir', fr:'Partager', de:'Teilen', pt:'Compartilhar' },
    again:       { en:'New film', es:'Nueva peli', fr:'Nouveau film', de:'Neuer Film', pt:'Novo filme' },
    copied:      { en:'Copied ✓', es:'Copiado ✓', fr:'Copié ✓', de:'Kopiert ✓', pt:'Copiado ✓' },
    solvedToday: { en:'Decoded today', es:'Descifrada hoy', fr:'Décodé aujourd’hui', de:'Heute gelöst', pt:'Decifrado hoje' },
    todaysAnswer:{ en:'Today’s answer', es:'La respuesta de hoy', fr:'La réponse du jour', de:'Die Lösung von heute', pt:'A resposta de hoje' },
    comeBack:    { en:'come back tomorrow', es:'vuelve mañana', fr:'revenez demain', de:'komm morgen wieder', pt:'volte amanhã' },
    loadFail:    { en:'Couldn’t start a round. Reload?', es:'No se pudo empezar. ¿Recargar?', fr:'Impossible de démarrer. Recharger ?', de:'Konnte nicht starten. Neu laden?', pt:'Não foi possível começar. Recarregar?' },
    errorPrefix: { en:'Error: ', es:'Error: ', fr:'Erreur : ', de:'Fehler: ', pt:'Erro: ' },
    backTo:      { en:'Back to CineLinks', es:'Volver a CineLinks', fr:'Retour à CineLinks', de:'Zurück zu CineLinks', pt:'Voltar para CineLinks' },
    footData:    { en:'Data from TMDB · part of', es:'Datos de TMDB · parte de', fr:'Données de TMDB · fait partie de', de:'Daten von TMDB · Teil von', pt:'Dados do TMDB · parte de' },
    exact:       { en:'exact', es:'exacto', fr:'exact', de:'exakt', pt:'exato' },
    close:       { en:'close', es:'cerca', fr:'proche', de:'nah', pt:'perto' },
    noMatch:     { en:'no match', es:'no coincide', fr:'aucun', de:'keins', pt:'nenhum' },
    colYear:     { en:'Year', es:'Año', fr:'Année', de:'Jahr', pt:'Ano' },
    colGenre:    { en:'Genre', es:'Género', fr:'Genre', de:'Genre', pt:'Género' },
    colLang:     { en:'Lang', es:'Idioma', fr:'Langue', de:'Sprache', pt:'Idioma' },
    colDir:      { en:'Dir', es:'Dir', fr:'Réal', de:'Regie', pt:'Real' },
    colCast:     { en:'Cast', es:'Reparto', fr:'Casting', de:'Cast', pt:'Elenco' },
    colKey:      { en:'Tags', es:'Claves', fr:'Thèmes', de:'Themen', pt:'Temas' },
    revealNote:  { en:'A match reveals the shared name below each row', es:'Cada coincidencia revela el nombre compartido debajo', fr:'Une correspondance révèle le nom partagé en dessous', de:'Ein Treffer zeigt den gemeinsamen Namen darunter', pt:'Cada coincidência revela o nome partilhado abaixo' },
    ladderTitle: { en:'Clues to the secret film', es:'Pistas de la peli secreta', fr:'Indices du film secret', de:'Hinweise zum Film', pt:'Pistas do filme secreto' },
    ladderMore:  { en:'one more each wrong guess', es:'otra por cada fallo', fr:'une de plus par erreur', de:'eine mehr pro Fehler', pt:'mais uma por erro' },
    dirPrefix:   { en:'dir. ', es:'dir. ', fr:'réal. ', de:'Regie: ', pt:'real. ' }
  };
  function TR(k){ var m=L[k]; if(!m||typeof m!=='object') return k; var l=_lang(); return (l==='en'?null:m[l])||m.en||k; }

  const isDaily=!/[?&]practice=1/.test(location.search);
  document.getElementById('modeLbl').textContent=isDaily?TR('daily'):TR('practice');
  (function(){
    var tg=document.querySelector('.tag'); if(tg) tg.textContent=TR('tagline');
    var hm=document.querySelector('.cl-home'); if(hm) hm.setAttribute('aria-label',TR('backTo'));
    var ft=document.querySelector('.foot'); if(ft) ft.innerHTML=TR('footData')+' <a href="/">CineLinks</a>';
  })();

  // ── helpers ───────────────────────────────────────────────
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(1664525,s)+1013904223)&0xffffffff;return (s>>>0)/4294967296;};}
  function shuffleSeeded(arr,seed){const a=[...arr],r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function api(path){return fetch('/api/tmdb?path='+path+'&language=en-US').then(r=>r.json());}
  function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
  function trk(n,p){try{if(window.Track)Track(n,p||{});}catch(_){}}
  function utcDay(){const n=new Date();return Math.floor(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())/864e5);}
  function poster(pp,sz){return pp?IMG+(sz||'w92')+pp:'/logo.png';}
  // Daily completion is stored the same way the other games store theirs, so the
  // home hub can light up the CineCode "✓ Done" badge (clueDone → cinecodeState).
  function loadDone(){try{return JSON.parse(localStorage.getItem('cinecodeState')||'null');}catch(_){return null;}}
  function saveDone(o){try{localStorage.setItem('cinecodeState',JSON.stringify(o));}catch(_){}}
  function seenIds(){try{return JSON.parse(localStorage.getItem('cinecodeSeen')||'[]');}catch(_){return[];}}
  function rememberId(id){try{const a=[id,...seenIds().filter(x=>x!==id)].slice(0,40);localStorage.setItem('cinecodeSeen',JSON.stringify(a));}catch(_){}}
  // Daily streak + record, kept locally (one update per UTC day, idempotent).
  function loadStats(){try{const s=JSON.parse(localStorage.getItem('cinecodeStats'));if(s&&s.dist)return s;}catch(_){}return {played:0,wins:0,streak:0,max:0,lastDay:-9,lastWinDay:-9,dist:[0,0,0,0,0,0]};}
  function bumpStats(won,score,day){
    const s=loadStats();
    if(s.lastDay===day) return s;
    s.played++;
    if(won){ const b=Math.max(1,Math.min(6,score))-1; s.dist[b]=(s.dist[b]||0)+1; s.wins++; s.streak=(s.lastWinDay===day-1)?s.streak+1:1; s.lastWinDay=day; s.max=Math.max(s.max,s.streak); }
    else { s.streak=0; }
    s.lastDay=day;
    try{localStorage.setItem('cinecodeStats',JSON.stringify(s));}catch(_){}
    return s;
  }
  function statsHTML(s){
    const wr=s.played?Math.round(100*s.wins/s.played):0;
    return '<div class="stats"><div class="stat"><b>'+s.streak+'</b>'+TR('streak')+'</div><div class="stat"><b>'+s.max+'</b>'+TR('best')+'</div><div class="stat"><b>'+s.played+'</b>'+TR('played')+'</div><div class="stat"><b>'+wr+'%</b>'+TR('won')+'</div></div>';
  }

  // ── movie data + attribute comparison ─────────────────────
  // 3 calls per film: details (year/genre/country), credits (director + top
  // cast, kept WITH names so a match can be REVEALED), and keywords (plot DNA).
  // Cast/keywords are the recall anchors — matches surface the shared name.
  // Keywords are CURATED: TMDB boilerplate ("aftercreditsstinger", "based on
  // novel", "sequel", format tags) is pure noise — a match on it points at a
  // huge category, not the film — so it's stripped before comparing/revealing.
  function isNoiseKw(name){
    return /credit|stinger|^based on|\bsequel\b|\bprequel\b|spin.?off|\b3d\b|\bimax\b|live action|woman director|independent film|duringcredit|aftercredit/i.test(name||'');
  }
  async function movieData(id){
    const [d,c,k]=await Promise.all([
      api('movie/'+id),
      api('movie/'+id+'/credits').catch(()=>({})),
      api('movie/'+id+'/keywords').catch(()=>({}))
    ]);
    if(!d || d.success===false || !d.id) return null;
    const crew=(c&&c.crew)||[], cast=(c&&c.cast)||[];
    const dir=crew.find(p=>p.job==='Director');
    return {
      id:d.id, title:d.title||d.name, year:parseInt((d.release_date||'').slice(0,4),10)||null,
      poster:d.poster_path,
      genreIds:(d.genres||[]).map(g=>g.id), genreNames:(d.genres||[]).map(g=>g.name),
      lang:d.original_language||'', countries:(d.production_countries||[]).map(p=>p.iso_3166_1),
      dirId:dir?dir.id:null, dirName:dir?dir.name:null,
      cast:cast.slice(0,10).map(p=>({id:p.id,name:p.name})),
      lead:cast.length?cast[0].name:null,
      kw:((k&&k.keywords)||[]).filter(w=>!isNoiseKw(w.name)).map(w=>({id:w.id,name:w.name}))
    };
  }
  function valid(m){ return !!(m && m.year && m.genreIds.length && m.dirId && m.cast.length); }

  // Each cell: {c:'green'|'gold'|'red', v:short token, ar:arrow, names:[revealed], t:tooltip}
  function yearCell(gy,sy){
    if(gy==null||sy==null) return {c:'red',v:'—',ar:null};
    const diff=Math.abs(gy-sy);
    const c=diff<=1?'green':diff<=10?'gold':'red';
    return {c:c, v:String(gy), ar:sy>gy?'up':sy<gy?'down':null, t:c==='green'?TR('exact'):c==='gold'?TR('close'):TR('noMatch')};
  }
  function genreCell(g,s){
    const gp=g.genreIds[0], sp=s.genreIds[0];
    const samePrimary = gp!=null && gp===sp;                       // green only for a matching lead genre
    const shared = g.genreIds.filter(x=>s.genreIds.indexOf(x)>=0);  // any genre in common (broad "Action" etc. → gold)
    const c = samePrimary?'green':shared.length?'gold':'red';
    const showId = c==='red' ? gp : (shared.indexOf(sp)>=0 ? sp : shared[0]);
    return {c:c, v:g.genreNames[g.genreIds.indexOf(showId)]||g.genreNames[0]||'—', ar:null, t:g.genreNames.join(', ')};
  }
  // DNA columns — reveal the shared name(s): the yellow letter you can see.
  function directorCell(g,s){
    const same = g.dirId && g.dirId===s.dirId;
    return {c:same?'green':'red', v:same?'✓':'—', ar:null, names:(same&&s.dirName)?[s.dirName]:[], t:same?s.dirName:TR('noMatch')};
  }
  function castCell(g,s){
    const shared = g.cast.filter(p=>s.cast.some(q=>q.id===p.id)).map(p=>p.name);
    const n=shared.length;
    return {c:n>=2?'green':n===1?'gold':'red', v:n?('×'+n):'—', ar:null, names:shared, t:n?shared.join(', '):TR('noMatch')};
  }
  function keywordCell(g,s){
    const shared = g.kw.filter(w=>s.kw.some(x=>x.id===w.id)).map(w=>w.name);
    const m=shared.length;
    return {c:m>=2?'green':m===1?'gold':'red', v:m?('×'+m):'—', ar:null, names:shared, t:m?shared.join(', '):TR('noMatch')};
  }
  function compare(g,s){
    return {
      year: yearCell(g.year,s.year),
      genre: genreCell(g,s),
      director: directorCell(g,s),
      cast: castCell(g,s),
      keyword: keywordCell(g,s)
    };
  }
  const CELL_ORDER=['year','genre','director','cast','keyword'];

  // Guaranteed clue ladder — the fix for "you only win if an anchor fires by
  // luck". Each wrong guess unlocks one REAL anchor of the SECRET, from vague to
  // most-identifying, so the space always collapses (like CineReel's guaranteed
  // ramp): keyword → keyword → supporting actor → director → lead. The grid
  // still rewards a smart guess (an early match beats waiting for the ladder).
  function buildHints(s){
    const h=[];
    if(s.kw[0]) h.push({i:'🏷', t:s.kw[0].name});
    if(s.kw[1]) h.push({i:'🏷', t:s.kw[1].name});
    if(s.cast[1]) h.push({i:'🎭', t:s.cast[1].name});
    if(s.dirName) h.push({i:'🎬', t:TR('dirPrefix')+s.dirName});
    if(s.cast[0]) h.push({i:'⭐', t:s.cast[0].name});
    return h;
  }

  async function pickSecret(){
    const pool=(window.CINECLUE_POOL||[]).filter(x=>typeof x==='number');
    if(!pool.length) return null;
    if(isDaily){
      const order=shuffleSeeded(pool, hash('cinecode-'+utcDay()));
      for(const id of order){ const m=await movieData(id); if(valid(m)) return m; }
    }else{
      const skip=new Set(seenIds());
      const order=shuffleSeeded(pool,(Math.random()*1e9)|0);
      const queue=[...order.filter(id=>!skip.has(id)),...order.filter(id=>skip.has(id))];
      for(const id of queue){ const m=await movieData(id); if(valid(m)){ rememberId(id); return m; } }
    }
    return null;
  }

  // ── game state ────────────────────────────────────────────
  let SECRET=null, rows=[], over=false, busy=false;

  function cellHTML(cell){
    return '<div class="cx '+cell.c+'"'+(cell.t?' title="'+esc(cell.t)+'"':'')+'>'+esc(cell.v)+(cell.ar?' <span class="ar">'+(cell.ar==='up'?'↑':'↓')+'</span>':'')+'</div>';
  }
  function anchorsHTML(c){
    const p=[], cap=arr=>arr.slice(0,3).map(esc).join(', ')+(arr.length>3?' +'+(arr.length-3):'');
    if(c.director.names&&c.director.names.length) p.push('<span class="ak">🎬</span> '+esc(c.director.names[0]));
    if(c.cast.names&&c.cast.names.length)         p.push('<span class="ak">🎭</span> '+cap(c.cast.names));
    if(c.keyword.names&&c.keyword.names.length)   p.push('<span class="ak">🏷</span> '+cap(c.keyword.names));
    return p.length?'<div class="anchors">'+p.join('<span class="asep">·</span>')+'</div>':'';
  }
  function rowHTML(r){
    const c=r.cells;
    return '<div class="grow">'+
      '<div class="gtitle"><img src="'+poster(r.movie.poster)+'" alt=""><span><span class="t">'+esc(r.movie.title)+'</span> <span class="y">'+(r.movie.year||'')+'</span></span></div>'+
      '<div class="gstrip">'+CELL_ORDER.map(k=>cellHTML(c[k])).join('')+'</div>'+
      anchorsHTML(c)+
    '</div>';
  }
  function headHTML(){
    return '<div class="ghead"><div class="ghl">'+TR('colYear')+'</div><div class="ghl">'+TR('colGenre')+'</div><div class="ghl">'+TR('colDir')+'</div><div class="ghl">'+TR('colCast')+'</div><div class="ghl">'+TR('colKey')+'</div></div>';
  }
  // The clue ladder panel: revealed anchors of the secret + locked slots so the
  // player SEES that persisting unlocks more (one per wrong guess).
  function ladderHTML(){
    const hints=(SECRET&&SECRET.hints)||[];
    if(!hints.length) return '';
    const shown=Math.min(hints.length, rows.length);
    let chips='';
    for(let i=0;i<hints.length;i++){
      chips+= i<shown
        ? '<span class="lchip"><span class="lk">'+hints[i].i+'</span> '+esc(hints[i].t)+'</span>'
        : '<span class="lchip locked">🔒</span>';
    }
    return '<div class="ladder"><div class="ltitle">'+TR('ladderTitle')+(shown<hints.length?' <span class="lmore">· '+TR('ladderMore')+'</span>':'')+'</div><div class="lchips">'+chips+'</div></div>';
  }
  function legendHTML(){
    return '<div class="legend"><span><i style="background:var(--green)"></i>'+TR('exact')+'</span><span><i style="background:var(--gold)"></i>'+TR('close')+'</span><span><i style="background:var(--red)"></i>'+TR('noMatch')+'</span></div><div class="revnote">'+TR('revealNote')+'</div>';
  }

  function render(){
    let dots='';
    for(let i=0;i<MAX;i++){ const g=rows[i]; dots+='<div class="dot '+(g?(g.win?'win':'used'):'')+'"></div>'; }
    const left=MAX-rows.length;
    stage.innerHTML=
      headHTML()+
      rows.map(rowHTML).join('')+
      '<div class="dots">'+dots+'</div>'+
      (over?'':
        ladderHTML()+
        '<div class="hint">'+TR('prompt')+' · '+left+' '+TR('left')+'</div>'+
        '<div class="guess"><input id="gi" type="text" autocomplete="off" placeholder="'+TR('placeholder')+'"><div class="ac" id="ac" style="display:none"></div></div>'+
        '<div class="miss" id="miss"></div>'+
        legendHTML())+
      '<div class="result'+(over?' show':'')+'" id="result"></div>';
    if(over) renderResult(); else wireInputs();
  }

  function setBusy(b){ const gi=document.getElementById('gi'); if(gi) gi.disabled=b; }
  function flashMiss(t){ const m=document.getElementById('miss'); if(m) m.textContent=t; }

  function wireInputs(){
    const gi=document.getElementById('gi'), ac=document.getElementById('ac');
    gi.focus();
    let sel=-1, items=[];
    gi.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ const pick=sel>=0?items[sel]:items[0]; if(pick){ ac.style.display='none'; submit(pick); } }
      else if(e.key==='ArrowDown'){sel=Math.min(sel+1,items.length-1);paint();e.preventDefault();}
      else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);paint();e.preventDefault();}
    });
    function paint(){[...ac.children].forEach((el,i)=>el.classList.toggle('sel',i===sel));}
    const lookup=debounce(async q=>{
      if(q.trim().length<2){ac.style.display='none';return;}
      const res=await api('search/multi&query='+encodeURIComponent(q));
      items=(res.results||[]).filter(x=>x.media_type==='movie'&&x.poster_path).slice(0,6)
        .map(x=>({id:x.id,title:x.title||x.name,poster:x.poster_path,year:(x.release_date||'').slice(0,4)}));
      if(!items.length){ac.style.display='none';return;}
      ac.innerHTML=items.map((p,i)=>
        '<div class="ac-item" data-i="'+i+'"><img src="'+poster(p.poster)+'" alt=""><div><div class="nm">'+esc(p.title)+'</div><div class="kf">'+(p.year||'')+'</div></div></div>').join('');
      sel=-1; ac.style.display='block';
      [...ac.children].forEach(el=>el.onclick=()=>{ac.style.display='none';submit(items[+el.dataset.i]);});
    },240);
    gi.addEventListener('input',()=>lookup(gi.value));
  }

  async function submit(it){
    if(over||busy||!it) return;
    if(rows.some(r=>r.movie.id===it.id)){ flashMiss(TR('already')); return; }
    busy=true; setBusy(true); flashMiss('');
    const g=await movieData(it.id);
    busy=false; setBusy(false);
    if(!g){ flashMiss(TR('nope')); return; }
    const win=g.id===SECRET.id;
    rows.push({movie:{id:g.id,title:g.title,year:g.year,poster:g.poster}, cells:compare(g,SECRET), win:win});
    if(win||rows.length>=MAX) over=true;
    trk('cinecode_guess',{mode:isDaily?'daily':'practice',turn:rows.length,win:win});
    try{ if(window.Sfx){ if(win){Sfx.win&&Sfx.win();Sfx.haptic&&Sfx.haptic([12,40,12,70]);} else {Sfx.deadEnd&&Sfx.deadEnd();Sfx.haptic&&Sfx.haptic([30,25,30]);} } }catch(_){}
    if(window.Fx) Fx.shake(win?1.2:0.5);
    render();
  }

  function renderResult(){
    const won=rows.some(r=>r.win);
    const score=won?rows.length:MAX;
    const s=SECRET;
    let stats=null;
    if(isDaily){
      saveDone({day:utcDay(),finished:true,won:won,score:score,title:s.title,year:s.year,poster:s.poster,dirName:s.dirName,lead:s.lead,rows:rows});
      stats=bumpStats(won,score,utcDay());
      // Daily win → the secret film is the prize card: floor rare, +2 for a 1-2 solve, +1 within three.
      try{
        if(won && window.Collection){
          const nc=Collection.add([{ id:s.id, type:'movie', name:s.title, img:s.poster, rarityFloor:'rare', bump: score<=2?2:score<=3?1:0 }]);
          if(nc&&nc.length){
            try{ const w=JSON.parse(localStorage.getItem('clCardWins')||'[]'); if(w.indexOf('code')<0){ w.push('code'); localStorage.setItem('clCardWins',JSON.stringify(w)); } }catch(_e){}
            if(Collection.reveal) setTimeout(function(){ Collection.reveal(nc); },800);
          }
        }
      }catch(_){}
    }
    trk('cinecode_end',{mode:isDaily?'daily':'practice',won:won,score:score});
    const dayN=utcDay()-Math.floor(Date.UTC(2026,0,1)/864e5);
    const grid=rows.map(r=>CELL_ORDER.map(k=>r.cells[k].c==='green'?'🟩':r.cells[k].c==='gold'?'🟨':'🟥').join('')).join('\n');
    const share='🎬 CineCode'+(isDaily?' #'+dayN:'')+' '+(won?score+'/'+MAX:'X/'+MAX)+'\n'+grid+'\nhttps://cinelinks.vercel.app/cinecode.html';
    const credit=(s.dirName?('dir. '+s.dirName):'')+(s.lead?(s.dirName?' · ':'')+s.lead:'');
    document.getElementById('result').innerHTML=
      '<h2 class="'+(won?'win':'')+'">'+(won?TR('gotIt'):TR('soClose'))+'</h2>'+
      '<div class="who"><img src="'+poster(s.poster,'w185')+'" alt=""><div><div class="nm">'+esc(s.title)+' <span class="y">'+(s.year||'')+'</span></div>'+
        '<div class="sub">'+(won?(TR('solvedIn')+' '+score+'/'+MAX+' '+TR('tries')):TR('theAnswer'))+'</div>'+
        (credit?'<div class="cred">'+esc(credit)+'</div>':'')+'</div></div>'+
      (stats?statsHTML(stats):'')+
      '<div class="row"><button class="btn" id="shareBtn">'+TR('share')+'</button><button class="btn gold" id="again">'+(isDaily?TR('practice'):TR('again'))+'</button></div>';
    if(won && window.Fx) setTimeout(()=>Fx.confetti({count:90}),160);
    document.getElementById('again').onclick=()=>{location.href='/cinecode.html'+(isDaily?'?practice=1':'?practice=1&r='+Date.now());};
    document.getElementById('shareBtn').onclick=()=>{
      if(navigator.share){navigator.share({text:share}).catch(()=>{});}
      else{navigator.clipboard&&navigator.clipboard.writeText(share);const b=document.getElementById('shareBtn');b.textContent=TR('copied');}
    };
  }

  function renderReplay(d){
    SECRET={title:d.title,year:d.year,poster:d.poster,id:d.id};
    rows=d.rows||[]; over=true;
    stage.innerHTML=
      headHTML()+
      rows.map(rowHTML).join('')+
      '<div class="result show" id="result">'+
      '<h2 class="'+(d.won?'win':'')+'">'+(d.won?TR('solvedToday'):TR('todaysAnswer'))+'</h2>'+
      '<div class="who"><img src="'+poster(d.poster,'w185')+'" alt=""><div><div class="nm">'+esc(d.title)+' <span class="y">'+(d.year||'')+'</span></div>'+
      '<div class="sub">'+(d.won?(TR('solvedIn')+' '+(d.score||'?')+'/'+MAX+' '+TR('tries')):TR('comeBack'))+'</div>'+
      ((d.dirName||d.lead)?'<div class="cred">'+esc((d.dirName?('dir. '+d.dirName):'')+(d.lead?(d.dirName?' · ':'')+d.lead:''))+'</div>':'')+'</div></div>'+
      statsHTML(loadStats())+
      '<div class="row"><button class="btn gold" id="again">'+TR('practice')+'</button></div></div>';
    document.getElementById('again').onclick=()=>{location.href='/cinecode.html?practice=1';};
  }

  // ── boot ──────────────────────────────────────────────────
  (async()=>{
    try{
      if(isDaily){const d=loadDone(); if(d&&d.day===utcDay()&&d.finished){renderReplay(d);return;}}
      SECRET=await pickSecret();
      if(!SECRET){stage.innerHTML='<div class="loading">'+TR('loadFail')+'</div>';return;}
      SECRET.hints=buildHints(SECRET);
      rows=[]; over=false; trk('cinecode_start',{mode:isDaily?'daily':'practice'}); render();
    }catch(e){stage.innerHTML='<div class="loading">'+TR('errorPrefix')+e.message+'</div>';}
  })();
})();
</script>
<script defer src="/analytics.js"></script>
<script defer src="/feedback.js"></script>
