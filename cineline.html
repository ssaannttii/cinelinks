<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#252c35;--s1:#2c343f;--s2:#343d49;--bdr:rgba(255,255,255,0.07);--txt:#f0f0f0;--mut:#9aa4b0;--gold:#e8a000;--golddim:rgba(232,160,0,0.15)}
body{font-family:'Schibsted Grotesk','Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
#cineBackdrop{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0;filter:blur(12px) brightness(.6);transform:scale(1.08);transition:opacity 1.6s ease;pointer-events:none}
#cineBackdrop.on{opacity:.1}
.wrap{max-width:600px;margin:0 auto;padding:18px 16px 60px}
.topbar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:18px}
.home-link{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;font-size:.8rem;font-weight:600}
.home-link:hover{color:var(--gold)}
.date-badge{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:var(--golddim);padding:4px 9px;border-radius:999px}
.cl-home{position:fixed;top:13px;left:13px;z-index:50;display:inline-flex;align-items:center;gap:5px;color:var(--mut);text-decoration:none;font-size:.78rem;font-weight:700;background:rgba(20,20,20,.6);border:1px solid var(--bdr);border-radius:999px;padding:7px 13px;backdrop-filter:blur(8px)}
.cl-home:hover{color:var(--gold);border-color:rgba(232,160,0,.45)}
.head{text-align:center;margin-bottom:16px}
.title{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.title span{color:var(--gold)}
.subtitle{color:var(--mut);font-size:.85rem;margin-top:4px}
.loading,.errbox{text-align:center;color:var(--mut);padding:40px 0;font-size:.9rem}
.progress{text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:6px 0 14px}
.progress b{color:var(--gold)}
/* current card to place */
.current{position:sticky;top:8px;z-index:5;background:linear-gradient(180deg,#1d1a12,var(--s1));border:1px solid rgba(232,160,0,.25);border-radius:16px;padding:14px;margin-bottom:14px;text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.45);animation:fadeIn .3s ease both}
.cc-label{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.cc-card{display:flex;align-items:center;justify-content:center;gap:14px;text-align:left}
.cc-card img{width:78px;height:117px;border-radius:8px;object-fit:cover;flex-shrink:0;box-shadow:0 12px 28px rgba(0,0,0,.45);background:var(--s2)}
.cc-title{font-size:1.15rem;font-weight:800;line-height:1.2}
.cc-q{font-size:.82rem;color:var(--mut);margin-top:5px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* timeline — vertical: full-width rows (poster + title + year), tap the gaps */
.tl-hint{font-size:.72rem;color:var(--mut);text-align:center;margin-bottom:6px}
.tl-wrap{display:block}
.tl-edge{display:block;width:100%;text-align:center;font-size:1.35rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);opacity:.34;line-height:1;margin:6px 0;user-select:none;cursor:pointer;background:transparent;border:none;font-family:inherit;padding:9px 0;border-radius:8px;transition:opacity .15s,background .15s}
.tl-edge:hover{opacity:.72;background:rgba(232,160,0,.06)}
.tl-edge:disabled{opacity:.12;cursor:default;background:transparent}
.tl-list{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.045);border:1px solid var(--bdr);border-radius:12px;padding:8px 12px;animation:fadeIn .25s ease both}
.tl-item img,.tl-item .tl-ph{width:40px;height:60px;border-radius:6px;object-fit:cover;background:var(--s2);flex-shrink:0;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.tl-name{flex:1;min-width:0;font-size:.92rem;font-weight:700;line-height:1.25}
.tl-yr{font-size:1.05rem;font-weight:800;color:var(--txt);flex-shrink:0;font-variant-numeric:tabular-nums}
.tl-item.correct{border-color:rgba(91,189,122,.45)}.tl-item.correct .tl-yr{color:#7fd49a}
.tl-item.wrong{border-color:rgba(216,80,58,.45)}.tl-item.wrong .tl-yr{color:#e8806f}
.tl-item.anchor{border-color:rgba(232,160,0,.35)}.tl-item.anchor .tl-yr{color:var(--gold)}
.tl-slot{position:relative;width:100%;height:38px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(232,160,0,0);font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transition:color .12s}
.tl-slot::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:2px;transform:translateY(-50%);border-radius:2px;background:repeating-linear-gradient(90deg,rgba(232,160,0,.22) 0 7px,transparent 7px 14px);transition:background .12s}
.tl-slot:hover,.tl-slot:focus{color:var(--gold);outline:none}
.tl-slot:hover::before,.tl-slot:focus::before{background:rgba(232,160,0,.6)}
.tl-slot.done{display:none}
/* Discover: every placed film is tappable → a compact info sheet (homage to learning about cinema). */
.tl-item{cursor:pointer;transition:border-color .15s,background .15s}
.tl-item:hover,.tl-item:focus-visible{border-color:rgba(232,160,0,.45);background:rgba(232,160,0,.05);outline:none}
#clInfo{position:fixed;inset:0;z-index:120;display:none;align-items:flex-end;justify-content:center;padding:0;background:rgba(8,11,15,.72);backdrop-filter:blur(6px)}
#clInfo.on{display:flex;animation:clifFade .2s ease both}
@keyframes clifFade{from{opacity:0}to{opacity:1}}
.clif-card{position:relative;width:100%;max-width:440px;background:var(--s1);border:1px solid var(--bdr);border-top:1px solid rgba(232,160,0,.35);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:clifUp .34s cubic-bezier(.22,1,.36,1) both}
@keyframes clifUp{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.clif-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.06);color:var(--mut);font-size:1.1rem;line-height:1;cursor:pointer}
.clif-top{display:flex;gap:14px}
.clif-top img{width:78px;height:117px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--s2);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.clif-h{min-width:0;flex:1;padding-right:26px}
.clif-title{font-family:var(--fdisp);font-weight:600;font-size:1.2rem;line-height:1.15;color:var(--txt)}
.clif-year{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.clif-dir{font-size:.82rem;color:var(--mut);margin-top:6px;line-height:1.4}
.clif-dir b{color:var(--txt);font-weight:700}
.clif-genres{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.clif-genres span{font-size:.64rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--gold);background:rgba(232,160,0,.13);border-radius:999px;padding:3px 9px}
.clif-line{font-size:.9rem;line-height:1.55;color:var(--txt);margin-top:14px}
.clif-line.tagline{font-family:var(--fdisp);font-style:italic;color:#e8d9b6}
.clif-foot{font-size:.62rem;color:var(--mut);margin-top:14px;text-align:center}
.clif-load{min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.82rem}
@media(prefers-reduced-motion:reduce){#clInfo.on,.clif-card{animation:none}}
/* result */
.result{text-align:center;margin-top:10px;background:linear-gradient(180deg,rgba(232,160,0,.08),transparent 140px),var(--s1);border:1px solid rgba(232,160,0,.18);border-radius:16px;padding:24px 18px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:fadeIn .35s ease both}
.result.hidden{display:none}
.result-learn{font-size:.74rem;font-weight:700;color:var(--gold);opacity:.85;margin-bottom:10px}
.result-verdict{font-size:1.4rem;font-weight:800;margin-bottom:2px}
.result-verdict.win{color:#5bbd7a}.result-verdict.lose{color:#e8a000}
.result-sub{color:var(--mut);font-size:.85rem;margin-bottom:12px}
.result-grid{font-size:1.25rem;letter-spacing:3px;margin:10px 0 6px;line-height:1.5}
.result-streak{color:var(--mut);font-size:.82rem;margin-bottom:14px}
.result-streak strong{color:var(--gold)}
.result-actions{display:flex;gap:10px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bdr);background:transparent;color:var(--txt);font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:rgba(232,160,0,.5)}
.btn-gold{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.btn-gold:hover{opacity:.9}
.footer{text-align:center;margin-top:26px;color:var(--mut);font-size:.68rem;opacity:.7}
.footer a{color:var(--mut);text-decoration:none}.footer a:hover{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--s2);border:1px solid var(--bdr);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* desktop: roomier rows + bigger mystery poster */
@media(min-width:760px){.wrap{max-width:680px}.title{font-size:2.4rem}.cc-card img{width:92px;height:138px}.tl-item img,.tl-item .tl-ph{width:46px;height:69px}.tl-name{font-size:.98rem}.tl-edge{font-size:2.3rem}body{min-height:100vh;display:flex}.wrap{margin:auto}}
/* Wide screens: lay the timeline out HORIZONTALLY (oldest → newest, left → right).
   Same DOM (slot,item,slot,…) just flows as a row; items become little cards and
   the placement gaps become vertical dashed lines. Mobile keeps the vertical list. */
/* Horizontal timeline on desktop OR any wide/landscape aspect ratio (≥700px). */
@media (min-width:820px), (min-aspect-ratio:1/1) and (min-width:700px){
  .wrap{max-width:1060px}
  /* Older | timeline | Newer laid out in one centred row that fits all cards (no scroll). */
  .tl-wrap{display:flex;align-items:stretch;justify-content:center;gap:4px}
  .tl-edge{writing-mode:vertical-rl;width:auto;margin:0;font-size:1rem;letter-spacing:.18em;padding:6px 5px;flex-shrink:0;align-self:stretch;display:flex;align-items:center;justify-content:center}
  .tl-older{transform:rotate(180deg)}
  .tl-list{flex:1 1 auto;min-width:0;flex-direction:row;flex-wrap:nowrap;overflow:visible;align-items:stretch;justify-content:center;padding:8px 2px 14px;gap:0}
  .tl-item{flex:1 1 0;min-width:0;max-width:104px;flex-direction:column;gap:5px;text-align:center;align-items:center;padding:10px 6px}
  .tl-item img,.tl-item .tl-ph{width:58px;height:87px}
  .tl-name{flex:none;font-size:.72rem;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .tl-yr{font-size:.95rem}
  .tl-slot{flex:0 0 22px;width:22px;height:auto;min-height:150px;align-self:stretch}
  .tl-slot::before{left:50%;right:auto;top:14px;bottom:14px;height:auto;width:2px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,rgba(232,160,0,.22) 0 7px,transparent 7px 14px)}
  .tl-slot:hover::before,.tl-slot:focus::before{background:rgba(232,160,0,.6)}
}

  htStep5:      { en:'<b>Daily</b> is one shared deck a day; <b>Practice</b> deals a random one.', es:'El <b>Diario</b> es una baraja compartida al día; la <b>Práctica</b> reparte una al azar.', fr:'Le <b>Quotidien</b> est un paquet partagé par jour ; l’<b>Entraînement</b> en distribue un au hasard.', de:'Das <b>Tägliche</b> ist ein geteiltes Deck pro Tag; die <b>Übung</b> teilt ein zufälliges aus.', pt:'O <b>Diário</b> é um baralho compartilhado por dia; o <b>Treino</b> reparte um aleatório.' },
  htExample:    { en:'Drop the mystery film into the right gap by year.', es:'Suelta la película misteriosa en el hueco correcto según el año.', fr:'Déposez le film mystère dans le bon espace selon l’année.', de:'Lege den Rätselfilm nach Jahr in die richtige Lücke.', pt:'Solte o filme misterioso no espaço certo pelo ano.' },
  dataBy:       { en:'Data & images by', es:'Datos e imágenes de', fr:'Données et images par', de:'Daten und Bilder von', pt:'Dados e imagens por' },
  notEndorsed:  { en:'Not endorsed by TMDB.', es:'No respaldado por TMDB.', fr:'Non approuvé par TMDB.', de:'Nicht von TMDB unterstützt.', pt:'Não endossado pela TMDB.' },
  privacy:      { en:'Privacy', es:'Privacidad', fr:'Confidentialité', de:'Datenschutz', pt:'Privacidade' }
};
function T(k){ var m=L[k]; if(!m||typeof m!=='object') return k; var l=_lang(); return (l==='en'?null:m[l])||m.en||k; }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function api(path){ return fetch('/api/tmdb?path=' + path).then(r => r.json()); }
function dayNumber(){ const n = new Date(); return Math.floor(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()) / 86400000); }
function poster(p, size){ return p ? IMGBASE + (size || 'w185') + p : ''; }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1700); }

const DAY = dayNumber();
const PUZZLE = DAY - EPOCH + 1;
const PRACTICE = new URLSearchParams(location.search).get('practice') === '1';
const STATE_KEY = 'cinelineState';
const STREAK_KEY = 'cinelineStreak';

let deck = [];      // [{id,title,year,poster}]
let placed = [];    // cards on the timeline (each may carry _res)
let pendingIdx = 0; // index into deck of the card being placed
let results = [];   // 'correct' | 'wrong' per placement
let finished = false, solved = false, score = 0, lastPlaced = null;

// The daily deck avoids films seen in the previous NO_REPEAT_DAYS days. It's
// recomputed deterministically (same for everyone, no server): we replay each
// recent day's pick — each excluding ITS own prior window — so a film can't come
// back within a week. Pool is ~670 and a day uses ~16, so a 7-day block (~112)
// leaves plenty of variety. One number to tune the window.
const NO_REPEAT_DAYS = 7;
function dailyDeckOrder(pool, day, take){
  const recent = [];   // picked-id arrays, oldest → newest
  let todays = [];
  // Warm up from far enough back that the last NO_REPEAT_DAYS days each carry a
  // full history, then today's pick excludes exactly that rolling window.
  for(let d = day - 2 * NO_REPEAT_DAYS; d <= day; d++){
    const banned = new Set();
    recent.slice(-NO_REPEAT_DAYS).forEach(arr => arr.forEach(id => banned.add(id)));
    todays = Timeline.shuffle(pool, d).filter(id => !banned.has(id)).slice(0, take);
    recent.push(todays);
  }
  return todays;
}

async function loadDeck(){
  // Practice = endless deck: one recognisable film per decade from TMDB Discover
  // (Discover results already carry title/date/poster, so no per-id fetch).
  if(PRACTICE && window.Pool){
    try{
      const perDecade = await Promise.all(Pool.DECADES.map(async d => {
        try{ const data = await api(Pool.decadeMovie(d)); const r = (data && data.results) || []; if(r.length) return r[Math.floor(Math.random()*Math.min(r.length,10))]; }catch(_){}
        return null;
      }));
      const cards = perDecade.filter(Boolean)
        .map(m => ({ id:m.id, title:m.title, year:parseInt((m.release_date||'').slice(0,4),10), poster:m.poster_path }))
        .filter(c => c.year && c.title);
      if(cards.length >= 6) return Timeline.shuffle(cards, Math.floor(Math.random()*1e9)).slice(0, DECK);
    }catch(_){}
    // not enough from Discover → fall back to the fixed pool below
  }
  const pool = window.CINELINE_POOL || [];
  if(!pool.length) throw new Error('empty pool');
  const order = PRACTICE
    ? Timeline.shuffle(pool, Math.floor(Math.random() * 1e9)).slice(0, 16)
    : dailyDeckOrder(pool, DAY, 16);
  const ds = await Promise.all(order.map(id => api('movie/' + id).catch(()=>null)));
  const cards = [];
  for(const d of ds){
    if(cards.length >= DECK) break;
    const y = d && parseInt((d.release_date || '').slice(0, 4), 10);
    if(d && d.id && d.title && y) cards.push({ id:d.id, title:d.title, year:y, poster:d.poster_path });
  }
  if(cards.length < 4) throw new Error('deck too small');
  return cards;
}

function sortedPlaced(){ return placed.slice().sort((a,b)=>a.year-b.year); }

function renderProgress(){
  const total = deck.length - 1;
  const placedCount = Math.min(pendingIdx - 1, total);
  if(finished){
    const already = renderProgress._c; renderProgress._c = true;       // count up once
    document.getElementById('progress').innerHTML = T('finalScore') + ' <b id="lineScore">' + (already ? score : 0) + ' / ' + total + '</b>';
    if(!already && window.Fx && Fx.countUp) Fx.countUp(document.getElementById('lineScore'), score, { suffix: ' / ' + total, ms: 700 });
  } else {
    document.getElementById('progress').innerHTML = T('placed') + ' <b>' + placedCount + ' / ' + total + '</b>';
  }
}

// ── Discover: lazy film info (director + genres + one evocative line) ──
// Two allow-listed TMDB calls (details + credits), cached forever per id.
const _finfoMem = {};
function movieInfo(id){
  if(_finfoMem[id]) return Promise.resolve(_finfoMem[id]);
  try{ const c = localStorage.getItem('cl_finfo_' + id); if(c){ _finfoMem[id] = JSON.parse(c); return Promise.resolve(_finfoMem[id]); } }catch(_){}
  const lang = (function(){ try{ const l = localStorage.getItem('clLang'); return (l && /^[a-z]{2}-[A-Z]{2}$/.test(l)) ? l : 'en-US'; }catch(_){ return 'en-US'; } })();
  return Promise.all([
    api('movie/' + id + '&language=' + lang).catch(() => null),
    api('movie/' + id + '/credits&language=' + lang).catch(() => null)
  ]).then(function(r){
    const d = r[0] || {}, cr = r[1] || {};
    const dirs = (cr.crew || []).filter(x => x.job === 'Director').map(x => x.name).slice(0, 2);
    const info = {
      dir: dirs,
      genres: (d.genres || []).slice(0, 3).map(g => g.name),
      tagline: (d.tagline || '').trim(),
      overview: (d.overview || '').trim(),
      runtime: d.runtime || 0
    };
    _finfoMem[id] = info; try{ localStorage.setItem('cl_finfo_' + id, JSON.stringify(info)); }catch(_){}
    return info;
  });
}
// Trim overview to one sentence (~160 chars) so the sheet stays a glance, not an essay.
function briefLine(info){
  if(info.tagline) return { t: info.tagline, cls: 'tagline' };
  let o = info.overview; if(!o) return null;
  if(o.length > 165){ const cut = o.slice(0, 165); const dot = cut.lastIndexOf('. '); o = (dot > 80 ? cut.slice(0, dot + 1) : cut.trim() + '…'); }
  return { t: o, cls: '' };
}
function openFilmInfo(id, title, year, posterSrc){
  if(!id) return;
  let ov = document.getElementById('clInfo');
  if(!ov){ ov = document.createElement('div'); ov.id = 'clInfo'; document.body.appendChild(ov); }
  const head =
    '<button class="clif-x" aria-label="Close">×</button>' +
    '<div class="clif-top">' +
      (posterSrc ? '<img src="' + posterSrc + '" alt="">' : '') +
      '<div class="clif-h"><div class="clif-title">' + esc(title) + ' <span class="clif-year">' + esc(year) + '</span></div>' +
      '<div id="clifMeta"></div></div>' +
    '</div><div id="clifBody" class="clif-load">…</div>' +
    '<div class="clif-foot">' + T('infoFoot') + '</div>';
  ov.innerHTML = '<div class="clif-card">' + head + '</div>';
  ov.classList.add('on');
  const close = () => { ov.classList.remove('on'); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.onclick = e => { if(e.target === ov) close(); };
  ov.querySelector('.clif-x').onclick = close;
  try{ if(window.Sfx) Sfx.haptic([8]); }catch(_){}
  movieInfo(id).then(function(info){
    const meta = document.getElementById('clifMeta'); if(meta){
      let m = '';
      if(info.dir && info.dir.length) m += '<div class="clif-dir">' + T('directedBy') + ' <b>' + esc(info.dir.join(' · ')) + '</b></div>';
      if(info.genres && info.genres.length) m += '<div class="clif-genres">' + info.genres.map(g => '<span>' + esc(g) + '</span>').join('') + '</div>';
      meta.innerHTML = m;
    }
    const body = document.getElementById('clifBody'); if(body){
      const bl = briefLine(info);
      body.className = bl ? ('clif-line ' + bl.cls) : 'clif-load';
      body.textContent = bl ? bl.t : T('infoNone');
    }
  }).catch(function(){ const body = document.getElementById('clifBody'); if(body){ body.className = 'clif-load'; body.textContent = T('infoNone'); } });
}

function renderTimeline(){
  const sorted = sortedPlaced(); // oldest → newest (top → bottom)
  let h = '';
  for(let i = 0; i <= sorted.length; i++){
    h += '<button class="tl-slot' + (finished ? ' done' : '') + '" data-slot="' + i + '"' + (finished ? ' disabled' : '') + ' aria-label="' + T('placeHere') + '">' + T('placeHere') + '</button>';
    if(i < sorted.length){
      const c = sorted[i];
      const flash = (c === lastPlaced) ? (c._res === 'correct' ? ' fx-bounce' : ' fx-shake') : '';
      const cls = c._anchor ? ' anchor' : (c._res ? ' ' + c._res : '');
      h += '<div class="tl-item' + cls + flash + '" data-mid="' + (c.id || '') + '" data-yr="' + c.year + '" role="button" tabindex="0" aria-label="' + esc(c.title) + ' — ' + T('learnAria') + '">' +
        (c.poster ? '<img src="' + poster(c.poster, 'w92') + '" alt="">' : '<div class="tl-ph"></div>') +
        '<span class="tl-name">' + esc(c.title) + '</span><span class="tl-yr">' + c.year + '</span>' + '</div>';
    }
  }
  const row = document.getElementById('timeline');
  row.innerHTML = h;
  lastPlaced = null;
  // The Older / Newer end labels are also big tap targets for the extreme placements.
  const eo = document.getElementById('edgeOlder'), en = document.getElementById('edgeNewer');
  if(eo && en){ eo.disabled = finished; en.disabled = finished; eo.onclick = () => { if(!finished) place(0); }; en.onclick = () => { if(!finished) place(sorted.length); }; }
  if(!finished) row.querySelectorAll('.tl-slot').forEach(b => { b.onclick = () => place(+b.dataset.slot); });
  row.querySelectorAll('.tl-item[data-mid]').forEach(it => {
    const open = () => openFilmInfo(it.getAttribute('data-mid'), it.querySelector('.tl-name').textContent, it.getAttribute('data-yr'), it.querySelector('img') && it.querySelector('img').src);
    it.onclick = open;
    it.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } };
  });
}

function renderCurrent(){
  const c = deck[pendingIdx];
  const el = document.getElementById('current');
  el.style.display = 'block';
  el.innerHTML =
    '<div class="cc-label">' + T('film') + ' ' + pendingIdx + ' ' + T('of') + ' ' + (deck.length - 1) + '</div>' +
    '<div class="cc-card">' +
      (c.poster ? '<img src="' + poster(c.poster, 'w342') + '" alt="">' : '') +
      '<div><div class="cc-title">' + esc(c.title) + '</div><div class="cc-q">' + T('whenReleased') + '</div></div>' +
    '</div>';
}

function place(slot){
  if(finished) return;
  const c = deck[pendingIdx];
  const ok = Timeline.isCorrect(sortedPlaced().map(x => x.year), c.year, slot);
  c._res = ok ? 'correct' : 'wrong';
  lastPlaced = c;
  results.push(c._res);
  placed.push(c);
  toast(ok ? ('✓ ' + c.title + ' — ' + c.year) : ('✗ ' + c.title + ' — ' + c.year));
  try{ if(window.Sfx){ if(ok){ Sfx.goalReach(); Sfx.haptic([10,25]); } else { Sfx.deadEnd(); Sfx.haptic([40,30,40]); } } }catch(_){}
  if(window.Fx) Fx.shake(ok ? 0.4 : 0.7);
  pendingIdx++;
  renderTimeline();
  renderProgress();
  if(pendingIdx >= deck.length){ finish(); }
  else { renderCurrent(); }
}

function emojiGrid(){
  let g = '';
  results.forEach((r, i) => { g += (r === 'correct' ? '🟩' : '🟥'); if((i + 1) % 5 === 0 && i + 1 < results.length) g += '\n'; });
  return g;
}

function finish(){
  finished = true;
  score = results.filter(r => r === 'correct').length;
  solved = score >= PASS;
  // Daily solve → collect every film you placed correctly; the deepest cut
  // (earliest year) is the prize, bumped for a flawless / near-flawless deck.
  try{
    if(solved && !PRACTICE && window.Collection){
      const corr = placed.filter(c => c._res === 'correct' && c.id);
      let prize = null; corr.forEach(c => { if(!prize || c.year < prize.year) prize = c; });
      const total = deck.length - 1;
      const bump = score === total ? 2 : score >= total - 2 ? 1 : 0;
      const nc = Collection.add(corr.map(c => {
        const it = { id: c.id, type: 'movie', name: c.title, img: c.poster };
        if(prize && c.id === prize.id){ it.rarityFloor = 'rare'; if(bump) it.bump = bump; }
        return it;
      }));
      if(nc && nc.length){
        try{ const w = JSON.parse(localStorage.getItem('clCardWins') || '[]'); if(w.indexOf('line') < 0){ w.push('line'); localStorage.setItem('clCardWins', JSON.stringify(w)); } }catch(_e){}
        if(Collection.reveal) setTimeout(() => { Collection.reveal(nc); }, 900);
      }
    }
  }catch(_){ /* collection is optional */ }
  const streak = updateStreak(solved);
  document.getElementById('current').style.display = 'none';
  document.getElementById('tlHint').style.display = 'none';
  renderTimeline();
  renderProgress();
  renderResult(streak);
  save();
}

function renderResult(streak){
  const el = document.getElementById('result');
  el.classList.remove('hidden');
  const total = deck.length - 1;
  const verdict = score === total ? T('verdictFlawless') : score >= PASS ? T('verdictNice') : T('verdictTough');
  const bestPart = streak.best > streak.current ? ' · ' + T('best') + ' <strong>' + streak.best + '</strong>' : '';
  const streakLine = PRACTICE ? '' : '<div class="result-streak">🔥 ' + T('streak') + ' <strong>' + streak.current + '</strong>' + bestPart + '</div>';
  const actions = PRACTICE
    ? '<button class="btn btn-gold" id="againBtn">' + T('newDeck') + '</button><button class="btn" id="shareBtn">' + T('share') + '</button>'
    : '<button class="btn btn-gold" id="shareBtn">' + T('share') + '</button><a class="btn" href="/">CineLinks</a>';
  el.innerHTML =
    '<div class="result-learn">' + T('learnHint') + '</div>' +
    '<div class="result-verdict ' + (score >= PASS ? 'win' : 'lose') + '">' + score + ' / ' + total + '</div>' +
    '<div class="result-sub">' + verdict + '</div>' +
    '<div class="result-grid">' + emojiGrid().replace(/\n/g, '<br>') + '</div>' +
    streakLine +
    '<div class="result-actions">' + actions + '</div>';
  el.classList.add('fx-in');
  if(solved){ try{ if(window.Sfx){ (score===total?Sfx.allDone():Sfx.win()); Sfx.haptic([12,40,12,70]); } }catch(_){} if(window.Fx){ Fx.shake(score===total?1.5:1.2); setTimeout(() => Fx.confetti({count:90}), 160); } }
  else { try{ if(window.Sfx){ Sfx.deadEnd(); Sfx.haptic([40,30,40]); } }catch(_){} if(window.Fx) Fx.shake(0.7); }
  document.getElementById('shareBtn').onclick = share;
  const again = document.getElementById('againBtn');
  if(again) again.onclick = () => { location.href = 'cineline.html?practice=1&n=' + Date.now(); };
}

function shareText(){
  const total = deck.length - 1;
  const head = PRACTICE ? ('🕰️ CineLine (' + T('practiceWord') + ')') : ('🕰️ CineLine #' + PUZZLE);
  const st = (!PRACTICE && solved) ? loadStreak() : null;
  const streak = (st && st.current > 1) ? '  🔥' + st.current : '';
  return head + '  ' + score + '/' + total + streak + '\n' + emojiGrid() + '\nhttps://cinelinks.vercel.app/cineline.html';
}
function share(){
  const text = shareText();
  if(navigator.share){ navigator.share({ text }).catch(()=>{}); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast(T('copied'))).catch(()=>toast(text)); }
  else toast(T('copyPrefix') + text);
}

function loadStreak(){ try{ const s = JSON.parse(localStorage.getItem(STREAK_KEY)); if(s) return { current:s.current|0, best:s.best|0, last:s.last|0 }; }catch(_){} return { current:0, best:0, last:0 }; }
function updateStreak(win){
  if(PRACTICE) return loadStreak();
  const s = loadStreak();
  if(s.last === DAY) return s;
  if(win){ s.current = (s.last === DAY - 1) ? s.current + 1 : 1; s.best = Math.max(s.best, s.current); }
  else { s.current = 0; }
  s.last = DAY;
  try{ localStorage.setItem(STREAK_KEY, JSON.stringify(s)); }catch(_){}
  return s;
}
function save(){
  if(PRACTICE) return;
  try{ localStorage.setItem(STATE_KEY, JSON.stringify({
    day: DAY, finished: true, solved, score, results,
    board: sortedPlaced().map(c => ({ title:c.title, year:c.year, poster:c.poster, _res:c._res, _anchor:c._anchor }))
  })); }catch(_){}
}
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(STATE_KEY)); if(s && s.day === DAY && s.finished) return s; }catch(_){}
  return null;
}

function showError(){ document.getElementById('loading').style.display = 'none'; const e = document.getElementById('error'); e.textContent = T('errorText'); e.style.display = 'block'; }

function applyStaticI18n(){
  const home = document.querySelector('.cl-home'); if(home) home.setAttribute('aria-label', T('backTo'));
  const sub = document.querySelector('.subtitle'); if(sub) sub.textContent = T('subtitle');
  const ld = document.getElementById('loading'); if(ld) ld.setAttribute('aria-label', T('loadingAria'));
  const err = document.getElementById('error'); if(err) err.textContent = T('errorText');
  const hint = document.getElementById('tlHint'); if(hint) hint.textContent = T('tlHint');
  const eo = document.getElementById('edgeOlder'); if(eo){ eo.textContent = T('older'); eo.setAttribute('aria-label', T('olderAria')); }
  const en = document.getElementById('edgeNewer'); if(en){ en.textContent = T('newer'); en.setAttribute('aria-label', T('newerAria')); }
  const ft = document.getElementById('footerText');
  if(ft) ft.innerHTML = T('dataBy') + ' <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>. ' + T('notEndorsed') + ' · <a href="/privacy.html" style="color:inherit">' + T('privacy') + '</a>';
}

async function init(){
  applyStaticI18n();
  document.getElementById('dateBadge').textContent = PRACTICE ? T('practiceWord') : (T('dailyHash') + PUZZLE);
  const sw = document.getElementById('modeSwitch');
  if(sw){ sw.textContent = PRACTICE ? T('dailyArrow') : T('practiceArrow'); sw.href = PRACTICE ? 'cineline.html' : 'cineline.html?practice=1'; }

  // Already played today's daily? Show the finished board (no replay).
  if(!PRACTICE){
    const saved = loadState();
    if(saved){
      placed = saved.board || [];
      results = saved.results || [];
      score = saved.score | 0;
      solved = !!saved.solved;
      finished = true;
      deck = new Array((results.length || 0) + 1); // length-1 == placements, for totals
      document.getElementById('loading').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      document.getElementById('current').style.display = 'none';
      document.getElementById('tlHint').style.display = 'none';
      renderTimeline(); renderProgress(); renderResult(loadStreak());
      return;
    }
  }

  try{ deck = await loadDeck(); }catch(e){ showError(); return; }
  deck[0]._anchor = true;
  placed = [deck[0]];
  pendingIdx = 1; results = []; finished = false; solved = false; score = 0;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  renderProgress(); renderCurrent(); renderTimeline();
}

init();
</script>
