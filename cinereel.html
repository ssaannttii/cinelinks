<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#252c35;--s1:#2c343f;--bdr:rgba(255,255,255,.07);--txt:#f0f0f0;--mut:#9aa4b0;--gold:#e8a000;--good:#5bbd7a}
body{font-family:'Schibsted Grotesk','Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex}
.wrap{max-width:560px;margin:auto;padding:26px 18px 70px;width:100%;text-align:center}
.logo{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.logo b{color:var(--gold)}
.tag{color:var(--mut);font-size:.9rem;margin:6px 0 4px}
.kicker{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:rgba(232,160,0,.15);padding:4px 9px;border-radius:999px;margin-bottom:20px;}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 18px;max-width:430px}
.cell{aspect-ratio:2/3;border-radius:12px;border:1px solid var(--bdr);background:var(--s1);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.cell img{width:100%;height:100%;object-fit:cover;animation:pop .35s cubic-bezier(.22,1,.36,1)}
.cell .lock{color:#3a3a3a;font-size:1.6rem;font-weight:800}
.cell .yr{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;font-size:.62rem;font-weight:600;padding:14px 4px 4px;letter-spacing:.03em}
.cell.next{border-color:rgba(232,160,0,.45);box-shadow:0 0 0 2px rgba(232,160,0,.18)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 16px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16)}
.dot.used{background:#c0494a}
.dot.win{background:var(--good)}
.hint{color:var(--mut);font-size:.82rem;margin:0 0 12px}
.guess{position:relative;max-width:420px;margin:0 auto}
.guess input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--bdr);background:rgba(255,255,255,.05);color:var(--txt);font-family:inherit;font-size:.95rem;outline:none}
.guess input:focus{border-color:rgba(232,160,0,.55)}
.ac{position:absolute;left:0;right:0;top:54px;background:#212831;border:1px solid var(--bdr);border-radius:12px;overflow:hidden;z-index:5;text-align:left;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.ac-item{display:flex;align-items:center;gap:10px;padding:8px 11px;cursor:pointer}
.ac-item:hover,.ac-item.sel{background:rgba(232,160,0,.12)}
.ac-item img{width:30px;height:42px;object-fit:cover;border-radius:5px;background:#333;flex-shrink:0}
.ac-item .nm{font-weight:600;font-size:.88rem}
.ac-item .kf{color:var(--mut);font-size:.72rem}
.row{display:flex;gap:8px;max-width:420px;margin:10px auto 0}
.btn{flex:1;padding:11px;border-radius:12px;border:1px solid var(--bdr);background:transparent;color:var(--txt);font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.btn.gold{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.btn:hover{opacity:.92}
.miss{min-height:20px;color:#d98b8b;font-size:.8rem;margin-top:10px}
.result{margin-top:18px;padding:18px;border-radius:16px;border:1px solid var(--bdr);background:rgba(255,255,255,.04);display:none}
.result.show{display:block;animation:pop .4s both}
.result h2{font-size:1.3rem;margin-bottom:4px}
.result h2.win{color:var(--good)}
.result .who{display:flex;align-items:center;gap:12px;justify-content:center;margin:12px 0}
.result .who img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.result .who .nm{font-weight:800;font-size:1.05rem;text-align:left}
.result .who .sub{color:var(--mut);font-size:.8rem}
.stats{display:flex;gap:16px;justify-content:center;margin:14px 0 2px}
.stat{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.6rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:1.2rem;color:var(--txt);font-weight:800}
.loading{color:var(--mut);font-size:.9rem;padding:40px 0}
.foot{margin-top:26px;color:var(--mut);font-size:.74rem}
.foot a{color:var(--gold);text-decoration:none}
.cl-home{position:fixed;top:13px;left:13px;z-index:50;display:inline-flex;align-items:center;gap:5px;color:var(--mut);text-decoration:none;font-size:.78rem;font-weight:700;background:rgba(20,20,20,.6);border:1px solid var(--bdr);border-radius:999px;padding:7px 13px;backdrop-filter:blur(8px)}
.cl-home:hover{color:var(--gold);border-color:rgba(232,160,0,.45)}
@media(min-width:760px){.wrap{max-width:620px}.logo{font-size:2.5rem}.tag{font-size:1rem}.kicker{font-size:.64rem}.board{max-width:540px;gap:14px}.hint{font-size:.95rem}.guess input{font-size:1.05rem;padding:15px 18px}.result h2{font-size:1.55rem}.who img{width:78px;height:78px}.who .nm{font-size:1.2rem}}

  const isDaily=!/[?&]practice=1/.test(location.search);

  // How strongly a credit identifies the actor: title fame × how central they are

  function billing(order){
    if(order==null) return 0.45;
    if(order<=0) return 1; if(order<=1) return .9; if(order<=2) return .8;

  async function buildCredits(personId){
    const cc=await api('person/'+personId+'/combined_credits');
    const seen=new Set();
    return (cc.cast||[])
      .filter(c=>c.poster_path && (c.vote_count||0)>=VOTE_FLOOR && (c.media_type==='movie'||c.media_type==='tv') && c.character && !/\b(self|himself|herself|host|presenter|narrator|guest|themselves)\b/i.test(c.character))

  // Build a real difficulty ramp: the signature lead is revealed LAST, and the earlier
  // posters are pulled from DEEP in their filmography (supporting turns, films far less
  // associated with them) so a famous face is never given away on poster 1. films is

  // the first posters clustered in the obscure band. Signature is appended separately so
  // it is always the final, guaranteed-solvable reveal.
  function revealSet(films){
    if(films.length<=REVEALS) return films.slice().reverse();
    const maxRank=Math.min(films.length-1, Math.max(REVEALS*5-1, 29)); // deepest cut (~30th credit) — harder start
    const gamma=1.7, need=REVEALS-1, idx=[];
    for(let k=0;k<need;k++){
      const frac=(need-k)/need;                       // k=0 -> deepest, later k -> shallower (never 0)
      let j=Math.max(1, Math.round(maxRank*Math.pow(frac,gamma)));
      while(idx.indexOf(j)>=0) j++;                   // dedupe by shifting toward the signature
      idx.push(Math.min(j, films.length-1));
    }
    return [...idx.map(function(j){return films[j];}), films[0]]; // deep-first, signature last
  }
  // recent actors seen in Practice — skipped next time so it doesn't repeat
  function seenIds(){try{return JSON.parse(localStorage.getItem('cinereelSeen')||'[]');}catch(_){return[];}}
  function rememberId(id){try{const a=[id,...seenIds().filter(x=>x!==id)].slice(0,40);localStorage.setItem('cinereelSeen',JSON.stringify(a));}catch(_){}}
  async function fromPerson(a){
    const [films,det]=await Promise.all([buildCredits(a.id), api('person/'+a.id).catch(()=>({}))]);
    if(films.length>=4) return {person:{id:a.id,name:a.name,profile_path:det.profile_path},reveal:revealSet(films)};
    return null;
  }
  async function pickTarget(){
    // Daily: deterministic pick from the curated pool (same actor for everyone, all day).
    if(isDaily){
      const order=shuffleSeeded(ACTOR_POOL, hash('cinereel-'+utcDay()));
      for(const a of order){ const t=await fromPerson(a); if(t) return t; }
    } else {
      // Practice: random from the pool, skipping recently-seen actors.
      const skip=new Set(seenIds());
      const order=shuffleSeeded(ACTOR_POOL, (Math.random()*1e9)|0);
      const queue=[...order.filter(a=>!skip.has(a.id)),...order.filter(a=>skip.has(a.id))];
      for(const a of queue){ const t=await fromPerson(a); if(t){ rememberId(a.id); return t; } }
    }
    return null;
  }
  function shuffleSeeded(arr,seed){const a=[...arr],r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  // ── game state ────────────────────────────────────────────
  let T=null, shown=1, guesses=[], over=false;

  function render(){
    const reveal=T.reveal, total=reveal.length;
    let cells='';
    for(let i=0;i<total;i++){
      const f=reveal[i];
      if(i<shown||over){
        cells+='<div class="cell'+(i===shown-1&&!over?' fx-pop':'')+'"><img src="'+IMG+'w342'+f.poster+'" alt=""><span class="yr">'+(f.year||'')+'</span></div>';
      }else{
        cells+='<div class="cell'+(i===shown?' next':'')+'"><span class="lock">?</span></div>';
      }
    }
    let dots='';                              // one dot per real guess (skips don't count)
    for(let i=0;i<guesses.length;i++){ dots+='<div class="dot '+(guesses[i].win?'win':'used')+'"></div>'; }
    stage.innerHTML=
      '<div class="board">'+cells+'</div>'+
      '<div class="dots">'+dots+'</div>'+
      (over?'':
        '<div class="hint">'+TR('whoseFilms')+'</div>'+
        '<div class="guess"><input id="gi" type="text" autocomplete="off" placeholder="'+TR('placeholder')+'"><div class="ac" id="ac" style="display:none"></div></div>'+
        '<div class="row">'+(shown<total?'<button class="btn" id="skip">'+TR('revealOne')+' ('+(total-shown)+' '+TR('left')+')</button>':'')+'<button class="btn gold" id="go">'+TR('guess')+'</button></div>'+
        '<div class="miss" id="miss"></div>')+
      '<div class="result'+(over?' show':'')+'" id="result"></div>';
    if(over) renderResult(); else wireInputs();
  }

  function wireInputs(){
    const gi=document.getElementById('gi'), ac=document.getElementById('ac');
    document.getElementById('go').onclick=()=>submit(gi.value);
    const sk=document.getElementById('skip'); if(sk) sk.onclick=()=>advance(false,null,true);
    gi.focus();
    let sel=-1, items=[];
    gi.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ if(sel>=0&&items[sel]) submit(items[sel].name); else submit(gi.value); }
      else if(e.key==='ArrowDown'){sel=Math.min(sel+1,items.length-1);paint();e.preventDefault();}
      else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);paint();e.preventDefault();}
    });
    function paint(){[...ac.children].forEach((el,i)=>el.classList.toggle('sel',i===sel));}
    const lookup=debounce(async q=>{
      if(q.trim().length<2){ac.style.display='none';return;}
      const res=await api('search/multi&query='+encodeURIComponent(q));
      items=(res.results||[]).filter(x=>x.media_type==='person'&&x.profile_path).slice(0,6);
      if(!items.length){ac.style.display='none';return;}
      ac.innerHTML=items.map((p,i)=>
        '<div class="ac-item" data-i="'+i+'"><img src="'+IMG+'w185'+p.profile_path+'" alt=""><div><div class="nm">'+p.name+'</div><div class="kf">'+((p.known_for||[]).slice(0,2).map(k=>k.title||k.name).filter(Boolean).join(', ')||TR('actorRole'))+'</div></div></div>').join('');
      sel=-1; ac.style.display='block';
      [...ac.children].forEach(el=>el.onclick=()=>submit(items[+el.dataset.i].name));
    },240);
    gi.addEventListener('input',()=>lookup(gi.value));
  }

  function submit(name){
    if(over||!name||!name.trim()) return;
    const win=norm(name)===norm(T.person.name);
    advance(win,name.trim());
  }
  function advance(win,name,isSkip){
    const total=T.reveal.length;
    if(win){
      guesses.push({win:true}); over=true;
      // Daily win → the guessed actor is the prize card: floor rare, +2 for
      // nailing it off the first poster, +1 within three.
      try{
        if(isDaily && window.Collection && T.person){
          const nc=Collection.add([{ id:T.person.id, type:'person', name:T.person.name, img:T.person.profile_path,
            rarityFloor:'rare', bump: shown===1?2:shown<=3?1:0 }]);
          if(nc&&nc.length){
            try{ const w=JSON.parse(localStorage.getItem('clCardWins')||'[]'); if(w.indexOf('reel')<0){ w.push('reel'); localStorage.setItem('clCardWins',JSON.stringify(w)); } }catch(_e){}
            if(Collection.reveal) setTimeout(function(){ Collection.reveal(nc); },800);
          }
        }
      }catch(_){ /* collection is optional */ }
      try{ if(window.Sfx){ Sfx.win(); Sfx.haptic([12,40,12,70]); } }catch(_){}
      if(window.Fx) Fx.shake(1.2);
      render(); return;
    }
    if(isSkip){ if(shown<total){ shown++; try{ if(window.Sfx) Sfx.cardFlip(); }catch(_){} render(); } return; } // reveal, no penalty
    guesses.push({win:false});                                  // a real wrong guess
    if(shown>=total){ over=true; render(); return; }            // no posters left → lost
    shown++; render();
    try{ if(window.Sfx){ Sfx.deadEnd(); Sfx.haptic([40,30,40]); } }catch(_){}
    if(window.Fx){ const gi=document.getElementById('gi'); if(gi) Fx.play(gi,'fx-shake',450); Fx.shake(0.6); }
    const m=document.getElementById('miss');
    if(m&&name) m.textContent='“'+name+'” '+TR('nope');
  }

  function renderResult(){
    const won=guesses.some(g=>g.win);
    const total=T.reveal.length;
    const score=won?shown:total;              // how many posters were needed
    const p=T.person;
    let stats=null;
    if(isDaily){
      saveDone({day:utcDay(),finished:true,won:won,score:score,name:p.name,photo:p.profile_path,posters:T.reveal.map(r=>r.poster)});
      stats=bumpStats(won,score,utcDay());
    }
    const dayN=utcDay()-Math.floor(Date.UTC(2026,0,1)/864e5);
    const squares=guesses.map(g=>g.win?'🟩':'🟥').join('');
    const share='🎬 CineReel'+(isDaily?' #'+dayN:'')+'\n'+squares+(won?' '+score+'/'+total:' X/'+total)+'\nhttps://cinelinks.vercel.app/cinereel.html';
    document.getElementById('result').innerHTML=
      '<h2 class="'+(won?'win':'')+'">'+(won?TR('gotIt'):TR('soClose'))+'</h2>'+
      '<div class="who"><img src="'+face(p.profile_path)+'" alt=""><div><div class="nm">'+p.name+'</div>'+
        '<div class="sub">'+(won?(TR('solvedAt')+' '+score+'/'+total+' '+TR('posters')):TR('theAnswer'))+'</div></div></div>'+
      (stats?statsHTML(stats):'')+
      '<div class="row"><button class="btn" id="shareBtn">'+TR('share')+'</button><button class="btn gold" id="again">'+(isDaily?TR('practice'):TR('newCareer'))+'</button></div>';
    const who=document.querySelector('#result .who img'); if(who) who.classList.add('fx-pop');
    if(won && window.Fx) setTimeout(()=>Fx.confetti({count:90}),160);
    document.getElementById('again').onclick=()=>{location.href='/cinereel.html'+(isDaily?'?practice=1':'?practice=1&r='+Date.now());};
    document.getElementById('shareBtn').onclick=()=>{
      if(navigator.share){navigator.share({text:share}).catch(()=>{});}
      else{navigator.clipboard&&navigator.clipboard.writeText(share);const b=document.getElementById('shareBtn');b.textContent=TR('copied');}
    };
  }

  function renderReplay(d){
    const total=(d.posters||[]).length||6;
    const grid=(d.posters||[]).map(p=>'<div class="cell"><img src="'+IMG+'w342'+p+'" alt=""></div>').join('');
    const score=d.score!=null?d.score:d.reels;
    stage.innerHTML=
      (grid?'<div class="board">'+grid+'</div>':'')+
      '<div class="result show">'+
      '<h2 class="'+(d.won?'win':'')+'">'+(d.won?TR('solvedToday'):TR('todaysAnswer'))+'</h2>'+
      '<div class="who"><img src="'+face(d.photo)+'" alt=""><div><div class="nm">'+d.name+'</div>'+
      '<div class="sub">'+(d.won?(TR('solvedAt')+' '+score+'/'+total+' '+TR('posters')):TR('comeBack'))+'</div></div></div>'+
      statsHTML(loadStats())+
      '<div class="row"><button class="btn gold" id="again">'+TR('practice')+'</button></div></div>';
    document.getElementById('again').onclick=()=>{location.href='/cinereel.html?practice=1';};
  }

  // ── boot ──────────────────────────────────────────────────
  (async()=>{
    try{
      if(isDaily){const d=loadDone(); if(d&&d.day===utcDay()&&d.finished){renderReplay(d);return;}}
      T=await pickTarget();
      if(!T){stage.innerHTML='<div class="loading">'+TR('loadFail')+'</div>';return;}
      shown=Math.min(START,T.reveal.length); guesses=[]; over=false; render();
    }catch(e){stage.innerHTML='<div class="loading">'+TR('errorPrefix')+e.message+'</div>';}
  })();
})();
</script>

<script defer src="/feedback.js"></script>
